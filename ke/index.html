<main id="view">
  <section class="gate" id="gate">
    <p class="eyebrow">修法弟子</p>
    <h1>入門一問</h1>
    <form id="gate-form" autocomplete="off">
      <label for="answer">青龍流祖庭是？</label>
      <input id="answer" name="answer" inputmode="text" autocapitalize="off" spellcheck="false" required>
      <label class="remember"><input type="checkbox" id="remember" checked> 此設備記住</label>
      <button type="submit">入</button>
      <p class="msg" id="gate-msg" aria-live="polite"></p>
    </form>
  </section>
</main>

<footer class="colophon">修法資料，請勿外傳。內容於本機解密；功課記錄只存本機。修習次第依阿闍梨所授為準。</footer>
