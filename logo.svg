          <g transform="rotate(180)"><g class="petal"><path class="po" d="M0-34C20-50 25-78 0-96-25-78-20-50 0-34Z"/><path class="pi" d="M0-56C10-64 13-78 0-88-13-78-10-64 0-56Z"/></g></g>
