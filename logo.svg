<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="logo" viewBox="-100 -100 200 200" width="512" height="512" role="img" aria-labelledby="ql-logo-t">
<style>
.logo{--petal:#efe6d3;--ink:#2b2620;--ink-2:#6b6157;--gold:#8a6a2f;--aura:#b8914a;--card:#fbf8f1}
@media (prefers-color-scheme:dark){.logo{--petal:#26221d;--ink:#ebe3d4;--ink-2:#aa9e8e;--gold:#cfa85e;--aura:#cfa85e;--card:#23201c}}
.po{fill:var(--petal);stroke:var(--ink-2);stroke-width:1;stroke-linejoin:round}.pi{fill:none;stroke:var(--gold);stroke-width:.7;opacity:.75}
.aura{fill:none;stroke:var(--aura);stroke-width:5;opacity:.3}.moon-fill{fill:var(--card)}.moon-line{fill:none;stroke:var(--ink);stroke-width:1.4}
.va,.bindu{fill:var(--gold)}.bindu-glow{display:none}
</style>
        <title id="ql-logo-t">青龍：八葉蓮華上月輪，中書悉曇種子字 鑁（vaṃ）</title>
        <defs>
          <filter id="ql-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
          
